services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Runs `alembic upgrade head` once, then exits — api/worker both wait for it
  # to finish before they start, so a new version with a schema change can
  # never run against a stale DB (the real production failure this closes:
  # a `column ... does not exist` 500, surfaced to users as a generic
  # "Cannot load modules"). A dedicated one-shot service, not api/worker
  # running it themselves, so the two never race trying to migrate at once.
  migrate:
    build:
      context: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build:
      context: ./backend
    env_file: .env
    environment:
      PHP_ANALYZER_URL: http://php-analyzer:8080
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - ${MAGEWIKI_ORDO_FIXTURE_PATH:-/dev/null}:${MAGEWIKI_ORDO_FIXTURE_PATH:-/dev/null}:ro
      - ${MAGEWIKI_MAGENTO_FIXTURE_PATH:-/tmp}:${MAGEWIKI_MAGENTO_FIXTURE_PATH:-/tmp}:ro
      - ${MAGEWIKI_SCAN_ROOT_1:-/dev/null}:${MAGEWIKI_SCAN_ROOT_1:-/dev/null}:ro
      - ${MAGEWIKI_SCAN_ROOT_2:-/dev/null}:${MAGEWIKI_SCAN_ROOT_2:-/dev/null}:ro
      - ${MAGEWIKI_SCAN_ROOT_3:-/dev/null}:${MAGEWIKI_SCAN_ROOT_3:-/dev/null}:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    # default (internet, db/redis) + php_analyzer_net (reaches php-analyzer,
    # which is on php_analyzer_net ONLY -- see that service's own comment).
    networks:
      - default
      - php_analyzer_net

  worker:
    build:
      context: ./backend
    env_file: .env
    environment:
      PHP_ANALYZER_URL: http://php-analyzer:8080
    volumes:
      - ./backend:/app
      - ${MAGEWIKI_ORDO_FIXTURE_PATH:-/dev/null}:${MAGEWIKI_ORDO_FIXTURE_PATH:-/dev/null}:ro
      - ${MAGEWIKI_MAGENTO_FIXTURE_PATH:-/tmp}:${MAGEWIKI_MAGENTO_FIXTURE_PATH:-/tmp}:ro
      - ${MAGEWIKI_SCAN_ROOT_1:-/dev/null}:${MAGEWIKI_SCAN_ROOT_1:-/dev/null}:ro
      - ${MAGEWIKI_SCAN_ROOT_2:-/dev/null}:${MAGEWIKI_SCAN_ROOT_2:-/dev/null}:ro
      - ${MAGEWIKI_SCAN_ROOT_3:-/dev/null}:${MAGEWIKI_SCAN_ROOT_3:-/dev/null}:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["arq", "app.tasks.worker.WorkerSettings"]
    networks:
      - default
      - php_analyzer_net

  php-analyzer:
    build:
      context: .
      dockerfile: php-analyzer/Dockerfile
    volumes:
      - ./backend:/app:ro
      - ${MAGEWIKI_ORDO_FIXTURE_PATH:-/dev/null}:${MAGEWIKI_ORDO_FIXTURE_PATH:-/dev/null}:ro
      - ${MAGEWIKI_MAGENTO_FIXTURE_PATH:-/tmp}:${MAGEWIKI_MAGENTO_FIXTURE_PATH:-/tmp}:ro
      - ${MAGEWIKI_SCAN_ROOT_1:-/dev/null}:${MAGEWIKI_SCAN_ROOT_1:-/dev/null}:ro
      - ${MAGEWIKI_SCAN_ROOT_2:-/dev/null}:${MAGEWIKI_SCAN_ROOT_2:-/dev/null}:ro
      - ${MAGEWIKI_SCAN_ROOT_3:-/dev/null}:${MAGEWIKI_SCAN_ROOT_3:-/dev/null}:ro
    # ONLY php_analyzer_net (internal: true, no internet route) -- not the
    # implicit `default` network every other service gets. run_phpunit()
    # (see index.php) is the first thing in this whole project that executes
    # a scanned module's own third-party code, not just parses it; cutting
    # egress off entirely at the container level is a second, independent
    # layer of defense that doesn't depend on disable_functions/timeout
    # inside the PHP process being complete. Nothing this sidecar does at
    # runtime ever needs the internet (composer install already happened at
    # image build time) -- api/worker stay on both networks since they
    # genuinely need internet (Packagist/GitHub/LLM calls) alongside
    # reaching this service.
    networks:
      - php_analyzer_net

  web:
    build:
      context: ./frontend
    env_file: .env
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - api
    command: ["npm", "run", "dev"]

networks:
  # internal: true means Docker gives this network no route to the internet
  # at all, regardless of anything the containers on it do themselves.
  php_analyzer_net:
    internal: true

volumes:
  db_data:
