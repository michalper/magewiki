# kind cluster config (not a kustomize resource): maps the NodePort services'
# fixed ports to localhost for browser/curl access from the host.
# Usage: kind create cluster --name magewiki --config k8s/overlays/kind/kind-config.yaml
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 8080
      - containerPort: 30030
        hostPort: 3080
