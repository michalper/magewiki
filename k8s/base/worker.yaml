apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
    spec:
      containers:
        - name: worker
          image: magewiki-backend:dev
          imagePullPolicy: IfNotPresent
          command: ["arq", "app.tasks.worker.WorkerSettings"]
          envFrom:
            - configMapRef:
                name: magewiki-config
            - secretRef:
                name: magewiki-secrets
