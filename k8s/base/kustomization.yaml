apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: magewiki

resources:
  - namespace.yaml
  - configmap.yaml
  - postgres.yaml
  - redis.yaml
  - migrate-job.yaml
  - api.yaml
  - worker.yaml
  - web.yaml
  - scan-cronjob.yaml

secretGenerator:
  - name: magewiki-secrets
    envs:
      - .env.k8s
