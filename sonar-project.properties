sonar.projectKey=michalper_magewiki
sonar.organization=michalper

# Makes the sonar CI job itself fail (not just show a dashboard) when the
# Quality Gate is red -- the scanner waits for server-side processing and
# exits non-zero. Verified the gate was genuinely green (new_coverage 99.3%
# vs the 80% threshold) before turning this on, so it starts blocking from a
# real passing baseline, not a surprise red build on the next push.
sonar.qualitygate.wait=true

# Generated/build artifacts -- never hand-edited, not worth analyzing.
sonar.exclusions=**/node_modules/**,**/.next/**,**/__pycache__/**,**/coverage/**,**/dist/**,**/*.pyc,frontend/lib/api-types.ts

# Matches backend/pyproject.toml's own declared `python = ">=3.11,<3.15"` --
# without this, SonarPython analyzes against every version it supports by
# default (3.10-3.14), which is less precise than the range this project
# actually commits to.
sonar.python.version=3.11,3.12,3.13,3.14

# Marks these as test code (as opposed to sonar.coverage.exclusions below,
# which only controls coverage-percent accounting): without sonar.tests,
# SonarCloud runs production-code rules against test files instead of the
# test-specific rule set, and skips test-only rules on them entirely.
sonar.tests=backend/tests,frontend/tests,frontend/**/*.test.ts,frontend/**/*.test.tsx

# Coverage reports -- produced by the backend/frontend CI jobs (pytest-cov,
# vitest) and downloaded into the sonar job via actions/upload-artifact /
# download-artifact (see ci.yml's `sonar` job's `needs: [backend, frontend]`).
# Without this, SonarCloud has no coverage data at all and silently reports
# 0% rather than erroring, which looks like a real regression instead of a
# missing wire-up.
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Coverage.exclusions (distinct from the general sonar.exclusions above --
# these files still get bugs/smells/security analysis, just no coverage
# expectation): test files never instrument themselves, so they always show
# 0% in a coverage report by construction -- confirmed directly via the
# public API that this, not a real gap, was the dominant cause of
# new_coverage reading ~40% while pytest-cov/vitest both report 100%
# (backend/tests's own files alone accounted for thousands of the reported
# "uncovered" lines; frontend/tests + co-located *.test.tsx accounted for
# 1476 of frontend's 1485). Alembic migrations are deliberately untested
# one-shot scripts (see CLAUDE.md's testing philosophy), and php-analyzer has
# no PHPUnit coverage report wired in at all -- it's verified via Python
# integration tests hitting its live HTTP endpoint, a strategy this
# per-file PHP coverage sensor can't see.
sonar.coverage.exclusions=backend/tests/**,backend/alembic/versions/**,php-analyzer/**,frontend/tests/**,frontend/**/*.test.ts,frontend/**/*.test.tsx,frontend/vitest.setup.ts,frontend/test-utils.tsx

# Issues accepted as noise against this project's own actual patterns, reviewed
# file-by-file (not rubber-stamped) over two passes recorded in CLAUDE.md under
# "Code-scanning/Dependabot alert triage" and "SonarCloud follow-up triage" --
# see those entries for the reasoning behind each line below. Anything NOT
# listed here is a real signal and should keep being read, not blanket-ignored.

sonar.issue.ignore.multicriteria=\
  e1,e2,e3,e4,e5,e6,e7,e8,e9,e10,\
  e11,e12,e13,e14,e15,e16,e17,e18,e19,e20,\
  e21,e22,e23,e24,e25,e26,e27,e28,e29,e30,\
  e31,e32,e33,e34,e35,e36,e37,e38,e39,e40,\
  e41,e42,e43,e44,e45

