name: Dependency Review

# Separate from ci.yml's own dependency checks (pip-audit/npm audit, Dependabot
# itself): those scan what's already in main on a schedule or after the fact.
# This one runs at PR time and blocks the PR itself if it introduces a new
# dependency with an already-known vulnerability -- a different point of
# control, not a duplicate of either.

on:
  pull_request:

permissions:
  contents: read

# A superseded run (an older commit on the same PR) is cancelled outright --
# its result would never matter once a newer commit's run exists for the same
# PR, so letting it keep consuming a runner is pure waste.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5
        with:
          # Matches this project's own pip-audit/npm-audit continue-on-error
          # posture for CVEs with no upstream fix yet (see CLAUDE.md and the
          # decision log) -- low severity findings alone shouldn't block a PR,
          # moderate-and-up should.
          fail-on-severity: moderate
          # This repo is MIT (see CLAUDE.md/LICENSE) -- block a new dependency
          # that's strong copyleft (GPL/AGPL), which would require this
          # project itself to be relicensed to keep distributing it. NOT
          # LGPL: the existing dependency tree already carries one real,
          # completely standard LGPL-3.0 package (sharp's libvips native
          # binding, a devDependency of Next.js's image optimizer) -- LGPL
          # explicitly permits use as a dependency without this project
          # inheriting its license, unlike GPL/AGPL.
          deny-licenses: GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later
