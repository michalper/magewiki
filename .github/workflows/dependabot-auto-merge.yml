name: Dependabot auto-merge

# pull_request, not pull_request_target: no step here checks out the PR's
# head ref, so pull_request_target buys nothing -- Dependabot PRs are
# same-repo branches (not forks), so plain pull_request already gets a
# write-capable GITHUB_TOKEN and secrets here same as pull_request_target
# would. pull_request_target is flagged categorically by some scanners
# (e.g. SonarCloud's githubactions:S7631) regardless of whether a checkout
# happens -- ordo hit this and switched for the same reason.
on: pull_request

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      # Major bumps still need a human look — only patch/minor auto-merge, and
      # only once CI (required status checks) is green; gh pr merge --auto just
      # enables auto-merge, it doesn't bypass any check.
      - name: Enable auto-merge for patch/minor updates
        if: steps.metadata.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
