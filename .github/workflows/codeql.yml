name: CodeQL

# Advanced setup (a committed workflow), not GitHub's managed "default
# setup" -- default setup was configured for 5 languages (actions,
# javascript, javascript-typescript, python, typescript) but real runs only
# ever produced one check ("Analyze (javascript-typescript)"), with the
# missing languages never showing up as jobs at all and the overall run
# still reporting failure. No committed config meant no visibility into
# why, and no way to control it beyond the repo Settings UI. Advanced
# setup makes the language matrix and triggers explicit and version-
# controlled, same reasoning as every other CI job in this repo.

# OpenSSF Scorecard's Token-Permissions check wants an explicit top-level
# default even when (like here) every job already sets its own narrower
# permissions block -- this is every other workflow file's own convention
# already (see ci.yml, dependency-review.yml), just missing here until now.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1" # weekly, matching the previous default-setup cadence

# CodeQL never deploys anything, so a superseded run can always be cancelled
# outright -- unlike ci.yml's own concurrency group, which only cancels on PR runs.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: github/codeql-action/init@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - uses: github/codeql-action/analyze@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          category: "/language:${{ matrix.language }}"
