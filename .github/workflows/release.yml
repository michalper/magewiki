name: Release

# Cuts a signed GitHub Release from a pushed vX.Y.Z tag: a source archive plus
# its SLSA/Sigstore build-provenance attestation, satisfying OpenSSF
# Scorecard's Signed-Releases check (it matches release assets by filename
# pattern only -- *.sigstore.json is one of its accepted patterns -- not by
# verifying the signature itself).

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build source archive
        run: |
          mkdir -p dist
          git archive --format=tar.gz \
            --prefix="magewiki-${GITHUB_REF_NAME#v}/" \
            -o "dist/magewiki-${GITHUB_REF_NAME}.tar.gz" \
            HEAD

      - name: Generate SLSA build provenance attestation
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/magewiki-${{ github.ref_name }}.tar.gz

      - name: Name the attestation bundle for Scorecard's Signed-Releases check
        run: cp "${{ steps.attest.outputs.bundle-path }}" "dist/magewiki-${GITHUB_REF_NAME}.tar.gz.sigstore.json"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/magewiki-${GITHUB_REF_NAME}.tar.gz" \
            "dist/magewiki-${GITHUB_REF_NAME}.tar.gz.sigstore.json" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
