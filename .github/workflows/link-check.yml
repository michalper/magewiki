name: Link Check

# Catches a broken link in README/docs before a reader does -- both when a
# doc changes (push/PR) and on a schedule (catches external link rot with no
# doc change at all, e.g. a linked repo going private or a page moving).
#
# --exclude-loopback/--exclude-private: README.md has several real
# http://localhost:* URLs in its local-dev-setup prose (e.g. "API health
# check: http://localhost:8000/health") -- nothing is listening on those in
# a CI runner, and checking them would always fail without ever meaning
# anything.

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
  pull_request:
    paths:
      - "**/*.md"
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

# A superseded run (an older commit on the same ref) is cancelled outright --
# its result would never matter once a newer commit's run exists for the same
# ref, so letting it keep consuming a runner is pure waste.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # args overrides the action's own default entirely rather than
          # merging with it -- confirmed the hard way, by a real failed run
          # ("required arguments were not provided: <inputs>...") when this
          # only had the flags below and no file globs at all. Globs match
          # the action's own documented default.
          args: --no-progress --exclude-loopback --exclude-private './**/*.md' './**/*.html' './**/*.rst'
          fail: true
