name: OpenSSF Scorecard

# Scores this repo's supply-chain security posture (branch protection, SAST,
# dependency pinning, token permissions, fuzzing, SBOM, and more) against the
# community-standard OpenSSF checklist and publishes the result publicly --
# feeds README's Scorecard badge. Deliberately NOT triggered by
# pull_request: GitHub doesn't grant pull_request-triggered runs the
# id-token: write permission this needs for public result publishing (a
# security restriction for forked-PR safety, not a config choice here), and
# that's also the Scorecard project's own documented recommendation for a
# public repo.

on:
  branch_protection_rule:
  schedule:
    - cron: "20 14 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@v4
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
