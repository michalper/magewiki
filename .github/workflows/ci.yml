name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

env:
  DATABASE_URL: postgresql+asyncpg://magewiki:changeme@localhost:5432/magewiki
  REDIS_URL: redis://localhost:6379/0

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: magewiki
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: magewiki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U magewiki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend-env
      - run: poetry run ruff check .
      - run: poetry run mypy app
      - run: poetry run pytest tests/ -v --cov=app --cov-report=xml
      - uses: codecov/codecov-action@v4
        with:
          files: backend/coverage.xml
          fail_ci_if_error: false
      - name: pip-audit (dependency vulnerability scan)
        # Non-blocking for now: 2 of today's 3 findings (starlette, filelock) are
        # transitive and blocked by fastapi's own <0.47.0 pin — fixing them needs a
        # dedicated fastapi major-version bump, tracked separately, not silently
        # ignored. lxml (the one directly-pinned, actually-fixable finding) is
        # already bumped. Always runs and stays visible in CI output either way.
        run: |
          poetry export --without-hashes -f requirements.txt -o /tmp/requirements-audit.txt
          poetry run pip-audit -r /tmp/requirements-audit.txt
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - run: npm install
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t magewiki-backend-ci ./backend
      - run: docker build -t magewiki-frontend-ci ./frontend
      - run: docker build -t magewiki-php-analyzer-ci -f php-analyzer/Dockerfile .

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - name: Wait for api and web to be ready
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:8000/scan-roots > /dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -sf http://localhost:3000/modules > /dev/null; do sleep 2; done'
      - run: docker compose exec -T api alembic upgrade head
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      - if: always()
        run: docker compose logs --tail=200

  rag-eval-comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: magewiki
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: magewiki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U magewiki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-backend-env
      - run: poetry run python -m app.evaluation.run_ci_eval
      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          path: backend/app/evaluation/report/ci_eval_comment.md
