name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql+asyncpg://magewiki:changeme@localhost:5432/magewiki
  REDIS_URL: redis://localhost:6379/0

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: magewiki
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: magewiki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U magewiki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend-env
      - run: poetry run ruff check .
      - run: poetry run mypy app
      - run: poetry run pytest tests/ -v --cov=app --cov-report=xml
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/coverage.xml
      - name: pip-audit (dependency vulnerability scan)
        # Non-blocking for now: 2 of today's 3 findings (starlette, filelock) are
        # transitive and blocked by fastapi's own <0.47.0 pin — fixing them needs a
        # dedicated fastapi major-version bump, tracked separately, not silently
        # ignored. lxml (the one directly-pinned, actually-fixable finding) is
        # already bumped. Always runs and stays visible in CI output either way.
        run: |
          poetry export --without-hashes -f requirements.txt -o /tmp/requirements-audit.txt
          poetry run pip-audit -r /tmp/requirements-audit.txt
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm install
      - run: npm run lint
      - run: npm run test:coverage
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
      - uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
      - run: npm run build
      - run: npm run size
      - run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonar:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarCloud wants full history, not a shallow clone
      - uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend
      - uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      # cache-from/cache-to: type=gha -- the three images built here are
      # rebuilt again, unchanged, by image-scan's own matrix and by
      # e2e-smoke's `docker compose up --build`, each on its own separate
      # runner with no shared local Docker daemon state. GitHub's Actions
      # cache backend (unlike the local Docker build cache) persists across
      # jobs/runners within the same workflow run, so warming it here lets
      # both of those later builds hit cache for every layer that hasn't
      # actually changed, instead of rebuilding from scratch a second and
      # third time. Scope names match image-scan's own matrix.image values
      # and e2e-smoke's own three cache-from/-to calls below.
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: magewiki-backend-ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          tags: magewiki-frontend-ci
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: php-analyzer/Dockerfile
          tags: magewiki-php-analyzer-ci
          load: true
          cache-from: type=gha,scope=php-analyzer
          cache-to: type=gha,mode=max,scope=php-analyzer

  image-scan:
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - image: php-analyzer
            context: .
            dockerfile: php-analyzer/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: magewiki-${{ matrix.image }}-ci
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # pip-audit/npm audit (in the backend/frontend jobs above) only scan the
      # project's own lockfiles — this catches CVEs in the OS-layer packages the
      # base image (e.g. python:3.13-slim) brings in, which nothing else here does.
      # continue-on-error, same as pip-audit above: a base-image OS-layer CVE with
      # no upstream fix yet shouldn't permanently block CI — findings still show
      # up in the step output and the Security tab (next step) either way.
      - name: Trivy scan (${{ matrix.image }})
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: magewiki-${{ matrix.image }}-ci
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload Trivy results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: "trivy-${{ matrix.image }}"

  e2e-smoke:
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # npm install (and the playwright browser install) must run BEFORE `docker
      # compose up` — docker-compose.yml's web service mounts ./frontend:/app with
      # node_modules/.next as separate container-only volumes, and bringing that
      # container up first makes Docker create host-side frontend/node_modules
      # owned by root, which the later npm install then can't write into
      # (EACCES) — confirmed directly from a real failed CI run, not a guess.
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - run: cp .env.example .env
      # A real scan root, not left empty like .env.example's default --
      # without this, is_within_scan_roots() fails closed and e2e tests
      # can never trigger a real scan through the UI, leaving every other
      # page's e2e coverage stuck testing only empty-state rendering.
      # The demo-store fixture is parser-only (no AI needed), so this scan
      # succeeds with no LLM/embedding key configured either.
      - run: echo "MAGEWIKI_SCAN_ROOT_1=$(pwd)/backend/tests/fixtures/demo-store" >> .env
      # Second scan root: two synthetic modules that deliberately conflict with
      # *each other* (cross-module conflict checks are scoped per repo_root, so
      # this can't exercise those checks against demo-store's own module) --
      # gives the e2e suite real coverage of acl_resource_conflict/missing_acl
      # and the whole fleet-wide conflict family, none of which demo-store's
      # single module can ever trigger. See frontend/tests/e2e/global-setup.ts.
      - run: echo "MAGEWIKI_SCAN_ROOT_2=$(pwd)/backend/tests/fixtures/conflict-store" >> .env
      - uses: docker/setup-buildx-action@v3
      # Pre-build and tag the three images docker-compose.yml's services
      # expect (api/worker/migrate share one backend build, same dedup
      # docker compose build itself would do), reading the same GHA cache
      # scopes the docker-build job (this job's own `needs:`) just warmed --
      # then `docker compose up -d` below with no --build reuses these
      # already-tagged local images instead of rebuilding from scratch a
      # third time. Tags match docker compose config --images' own
      # auto-generated names (<project>-<service>, project name "magewiki"
      # from this repo's directory name).
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          tags: magewiki-api,magewiki-worker,magewiki-migrate
          load: true
          cache-from: type=gha,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          tags: magewiki-web
          load: true
          cache-from: type=gha,scope=frontend
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: php-analyzer/Dockerfile
          tags: magewiki-php-analyzer
          load: true
          cache-from: type=gha,scope=php-analyzer
      - run: docker compose up -d
      - name: Wait for api and web to be ready
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:8000/scan-roots > /dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -sf http://localhost:3000/modules > /dev/null; do sleep 2; done'
      # Closes a known gap (see the decision log's "Stale generated OpenAPI
      # types" entry): frontend/lib/api-types.ts is hand-regenerated via
      # `npm run gen:types` against a live backend, and nothing previously
      # caught it going stale -- which once left a Settings flow silently
      # broken end-to-end for several sessions. The api container is
      # already live here on the same host:port gen:types targets, so no
      # new service is needed.
      - name: Check generated API types are up to date
        working-directory: frontend
        run: |
          npm run gen:types
          git diff --exit-code lib/api-types.ts
      - working-directory: frontend
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      - if: always()
        run: docker compose logs --tail=200

  # Public demo deployment (api -> Fly + Neon, web -> Fly) -- only after a
  # real push to main, gated on the jobs that actually prove the app
  # builds/works (backend/frontend unit+lint, docker-build, the real
  # e2e-smoke run), not on the informational/non-blocking security-scan
  # jobs. backend/fly.toml's own release_command (alembic upgrade head)
  # runs the Neon migration as part of `flyctl deploy` -- nothing extra
  # needed here for that. concurrency prevents two overlapping deploys if
  # two pushes land close together.
  deploy:
    name: Deploy to Fly.io
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend, docker-build, e2e-smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: fly-deploy
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - name: Install flyctl
        run: |
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
      # The "production" environment on GitHub's own Deployments tab used to
      # show a single, permanently stale entry from the very first manual
      # Fly.io setup (never updated since -- flyctl deploy itself never
      # touches the Deployments API, only Fly's own one-time GitHub App
      # ping did). Posting a real status here per CI run makes that tab an
      # accurate mirror of this job's own outcome, not a dead artifact from
      # day one. required_contexts: [] skips GitHub's legacy commit-status
      # gating -- readiness is already enforced by `needs:` above.
      - name: Create GitHub deployment
        id: gh_deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id=$(gh api "repos/${{ github.repository }}/deployments" --input - --jq .id <<'PAYLOAD'
          {"ref": "${{ github.sha }}", "environment": "production", "auto_merge": false, "required_contexts": [], "description": "api+web via flyctl"}
          PAYLOAD
          )
          echo "id=$id" >> "$GITHUB_OUTPUT"
          gh api "repos/${{ github.repository }}/deployments/$id/statuses" -f state=in_progress
      - name: Deploy API (backend/fly.toml -> magewiki-api)
        id: deploy_api
        working-directory: backend
        run: flyctl deploy --remote-only
      - name: Deploy Web (frontend/fly.toml -> magewiki-web)
        id: deploy_web
        working-directory: frontend
        run: flyctl deploy --config fly.toml --dockerfile Dockerfile.fly --remote-only
      - name: Report deployment status
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.deploy_api.outcome }}" = "success" ] && [ "${{ steps.deploy_web.outcome }}" = "success" ]; then
            state=success
          else
            state=failure
          fi
          gh api "repos/${{ github.repository }}/deployments/${{ steps.gh_deployment.outputs.id }}/statuses" \
            -f state="$state" \
            -f environment_url="https://magewiki-web.fly.dev"

  rag-eval-comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: magewiki
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: magewiki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U magewiki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend-env
      - run: poetry run python -m app.evaluation.run_ci_eval
      - uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: backend/app/evaluation/report/ci_eval_comment.md
