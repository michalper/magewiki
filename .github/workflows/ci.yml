name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DATABASE_URL: postgresql+asyncpg://magewiki:changeme@localhost:5432/magewiki
  REDIS_URL: redis://localhost:6379/0

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: magewiki
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: magewiki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U magewiki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend-env
      - run: poetry run ruff check .
      - run: poetry run mypy app
      - run: poetry run pytest tests/ -v --cov=app --cov-report=xml
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
      - name: pip-audit (dependency vulnerability scan)
        # Non-blocking for now: 2 of today's 3 findings (starlette, filelock) are
        # transitive and blocked by fastapi's own <0.47.0 pin — fixing them needs a
        # dedicated fastapi major-version bump, tracked separately, not silently
        # ignored. lxml (the one directly-pinned, actually-fixable finding) is
        # already bumped. Always runs and stays visible in CI output either way.
        run: |
          poetry export --without-hashes -f requirements.txt -o /tmp/requirements-audit.txt
          poetry run pip-audit -r /tmp/requirements-audit.txt
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - run: npm install
      - run: npm run lint
      - run: npm run test:coverage
      - uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
      - run: npm run build
      - run: npm audit --audit-level=high

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # SonarCloud wants full history, not a shallow clone
      - uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # The managed-JRE-metadata endpoint (api.sonarcloud.io/analysis/jres)
          # 403s for this project's token even with Automatic Analysis off --
          # skip it and run on ubuntu-latest's own preinstalled JRE instead.
          SONAR_SCANNER_SKIP_JRE_PROVISIONING: "true"

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t magewiki-backend-ci ./backend
      - run: docker build -t magewiki-frontend-ci ./frontend
      - run: docker build -t magewiki-php-analyzer-ci -f php-analyzer/Dockerfile .

  image-scan:
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - image: php-analyzer
            context: .
            dockerfile: php-analyzer/Dockerfile
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t magewiki-${{ matrix.image }}-ci -f ${{ matrix.dockerfile }} ${{ matrix.context }}
      # pip-audit/npm audit (in the backend/frontend jobs above) only scan the
      # project's own lockfiles — this catches CVEs in the OS-layer packages the
      # base image (e.g. python:3.13-slim) brings in, which nothing else here does.
      # continue-on-error, same as pip-audit above: a base-image OS-layer CVE with
      # no upstream fix yet shouldn't permanently block CI — findings still show
      # up in the step output and the Security tab (next step) either way.
      - name: Trivy scan (${{ matrix.image }})
        uses: aquasecurity/trivy-action@v0.36.0
        continue-on-error: true
        with:
          image-ref: magewiki-${{ matrix.image }}-ci
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload Trivy results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: "trivy-${{ matrix.image }}"

  e2e-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # npm install (and the playwright browser install) must run BEFORE `docker
      # compose up` — docker-compose.yml's web service mounts ./frontend:/app with
      # node_modules/.next as separate container-only volumes, and bringing that
      # container up first makes Docker create host-side frontend/node_modules
      # owned by root, which the later npm install then can't write into
      # (EACCES) — confirmed directly from a real failed CI run, not a guess.
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
      - working-directory: frontend
        run: npm install
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - name: Wait for api and web to be ready
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:8000/scan-roots > /dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -sf http://localhost:3000/modules > /dev/null; do sleep 2; done'
      - working-directory: frontend
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      - if: always()
        run: docker compose logs --tail=200

  rag-eval-comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: magewiki
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: magewiki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U magewiki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-backend-env
      - run: poetry run python -m app.evaluation.run_ci_eval
      - uses: marocchino/sticky-pull-request-comment@v3
        with:
          path: backend/app/evaluation/report/ci_eval_comment.md
