name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# main's branch protection requires these checks before a PR can merge: backend,
# frontend, e2e-smoke, and all 3 docker-build matrix legs ("docker-build (backend,
# ./backend, ./backend/Dockerfile)" etc. -- a matrix job's real check name always
# includes its matrix values in parens, not just the job id). Renaming/removing
# any of those, or changing docker-build's matrix shape, needs a matching update
# to the required_status_checks list (Settings > Branches, or via the API) --
# confirmed the hard way: PR #53 blocked forever on a required "docker-build"
# check that stopped existing the moment docker-build became a matrix, until the
# list itself was updated to the new per-leg names.
#
# Cancel a superseded run on the same PR/branch (saves runner minutes on fast
# force-pushes/rebases) -- but not on a push to main, to keep a stable trail of
# completed runs there instead of killed ones.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DATABASE_URL: postgresql+asyncpg://magewiki:changeme@localhost:5432/magewiki
  REDIS_URL: redis://localhost:6379/0

jobs:
  changes:
    # Detects whether this push/PR could actually affect k8s-smoke's own
    # result, so that job (the single slowest in this workflow -- a real
    # `kind` cluster bring-up, ~5 minutes) only runs when something it
    # actually exercises changed, instead of on every single push
    # regardless of diff. Not a required status check (see the note on
    # concurrency above), so skipping it changes nothing about what's
    # required to merge -- it still runs for real whenever k8s/ or any of
    # the 3 Dockerfiles/docker-compose.yml change, same coverage as before
    # for the changes that could actually break it.
    runs-on: ubuntu-latest
    outputs:
      k8s: ${{ steps.filter.outputs.k8s }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            k8s:
              - 'k8s/**'
              - 'docker-compose.yml'
              - 'backend/Dockerfile'
              - 'frontend/Dockerfile'
              - 'php-analyzer/Dockerfile'

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: magewiki
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: magewiki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U magewiki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-backend-env
      - run: poetry run ruff check .
      - run: poetry run mypy app
      - run: poetry run pytest tests/ -v --cov=app --cov-report=xml
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-coverage
          path: backend/coverage.xml
      - name: pip-audit (dependency vulnerability scan)
        run: |
          poetry export --without-hashes -f requirements.txt -o /tmp/requirements-audit.txt
          poetry run pip-audit -r /tmp/requirements-audit.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run test:coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: frontend/coverage/lcov.info
          flags: frontend
          fail_ci_if_error: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
      - run: npm run build
      - run: npm run size
      # Non-blocking, same reasoning as pip-audit above: every current high finding
      # traces back to picomatch (GHSA-fc5q-39xc-vjpf), which has no patched release
      # at all yet (first_patched_version: null on the advisory; 4.0.7, the latest
      # published version, is still inside the vulnerable range). Reached only via
      # dev tooling -- the shadcn CLI (code-generator, invoked manually, never
      # imported by app code) and the vite/vitest/eslint-config-next toolchain --
      # never the production dependency tree or bundle. Findings still show up in
      # the step output either way; this just stops a permanently unfixable
      # dev-only finding from blocking every PR until picomatch ships a fix.
      - run: npm audit --audit-level=high
        continue-on-error: true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sonar:
    needs: [backend, frontend]
    # GitHub never exposes regular repo secrets (SONAR_TOKEN included) to a
    # workflow run triggered by dependabot[bot] -- a deliberate security
    # restriction, not a config bug -- so this job fails with "Not authorized"
    # on every single Dependabot PR regardless of the dependency bump itself.
    # Skipping it there isn't a quality trade-off: there's no code change for
    # Sonar to say anything useful about on a version-bump-only diff anyway.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # SonarCloud wants full history, not a shallow clone
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-coverage
          path: backend
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: frontend-coverage
          path: frontend/coverage
      - uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      # The scan step above only submits the analysis -- it doesn't itself fail
      # if the quality gate comes back red, so a real regression (e.g. new
      # code below the coverage threshold, a new blocker/critical issue) was
      # invisible here, only visible by clicking through to the SonarCloud
      # dashboard. This polls report-task.txt (written by the scan step into
      # the shared checkout) for the gate result and fails the job on
      # anything but "OK".
      - uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  dockerfile-lint:
    # One job looping over all 3 Dockerfiles, not 3 matrix jobs -- hadolint
    # itself takes seconds per file; most of each old job's wall-clock was
    # pure runner-startup/checkout overhead, paid 3 times for no reason.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # if: always() on the 2nd/3rd -- a failing step otherwise skips every
      # step after it, so a backend/Dockerfile finding would silently hide
      # frontend/php-analyzer findings in the same run. The job's own
      # conclusion is still failure if any step failed, same gating as
      # before (fail-fast: false's matrix never skipped sibling jobs either).
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: backend/Dockerfile
          config: .hadolint.yaml
      - if: always()
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: frontend/Dockerfile
          config: .hadolint.yaml
      - if: always()
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: php-analyzer/Dockerfile
          config: .hadolint.yaml

  docker-build:
    # One matrix job per image, not 3 sequential builds in a single job --
    # the 3 builds don't depend on each other, so running them in parallel
    # shortens this job's own wall-clock to roughly the slowest single
    # build instead of the sum of all 3, which matters because every
    # downstream job (image-quality/e2e-smoke/k8s-smoke) waits on this one
    # finishing first.
    runs-on: ubuntu-latest
    # Backstop against GitHub's 6-hour default job ceiling silently eating
    # runner-minutes if buildx/the cache ever wedges -- a normal build of
    # any of these 3 images is minutes, not hours.
    timeout-minutes: 20
    strategy:
      matrix:
        include:
          - image: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - image: frontend
            context: ./frontend
            dockerfile: ./frontend/Dockerfile
          - image: php-analyzer
            context: .
            dockerfile: php-analyzer/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # cache-to: type=gha warms the GHA cache as a *fallback* (e.g. a
      # Dependabot run that only touches one job's dependency file still
      # lets other jobs' from-scratch builds hit cache for unrelated
      # layers). The image itself is built here once, saved, and handed to
      # every other job as an artifact below -- image-quality, e2e-smoke,
      # and k8s-smoke all `docker load` + `docker tag` that artifact
      # instead of each independently re-invoking buildx and re-pulling the
      # cache, which used to happen 4 times total for identical,
      # already-built image content.
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          tags: magewiki-${{ matrix.image }}-ci
          load: true
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      - name: Save the image for reuse by other jobs
        run: docker save magewiki-${{ matrix.image }}-ci -o /tmp/magewiki-${{ matrix.image }}-ci.tar
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: docker-image-${{ matrix.image }}
          path: /tmp/magewiki-${{ matrix.image }}-ci.tar
          retention-days: 1

  # image-scan/image-structure-test/sbom used to be 3 separate matrix jobs
  # (9 job runs total), each independently re-pulling the GHA cache and
  # rebuilding the same image from scratch just to run one check against it.
  # Merged into one job per image: the image is loaded once, then Trivy,
  # container-structure-test, and the SBOM generator each run against that
  # same already-loaded image -- same checks, a third of the runner
  # startup/cache-restore overhead.
  image-quality:
    needs: docker-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            dockerfile: ./backend/Dockerfile
          - image: frontend
            dockerfile: ./frontend/Dockerfile
          - image: php-analyzer
            dockerfile: php-analyzer/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: docker-image-${{ matrix.image }}
          path: /tmp
      - run: docker load -i /tmp/magewiki-${{ matrix.image }}-ci.tar
      # pip-audit/npm audit (in the backend/frontend jobs above) only scan the
      # project's own lockfiles — this catches CVEs in the OS-layer packages the
      # base image (e.g. python:3.13-slim) brings in, which nothing else here does.
      # continue-on-error, same as pip-audit above: a base-image OS-layer CVE with
      # no upstream fix yet shouldn't permanently block CI — findings still show
      # up in the step output and the Security tab (next step) either way.
      - name: Trivy scan (${{ matrix.image }})
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        continue-on-error: true
        with:
          image-ref: magewiki-${{ matrix.image }}-ci
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Upload Trivy results to the Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: "trivy-${{ matrix.image }}"
      - name: Install container-structure-test
        run: |
          curl -fLO https://github.com/GoogleContainerTools/container-structure-test/releases/download/v1.22.1/container-structure-test-linux-amd64
          chmod +x container-structure-test-linux-amd64
          sudo mv container-structure-test-linux-amd64 /usr/local/bin/container-structure-test
      - name: container-structure-test (${{ matrix.image }})
        run: container-structure-test test --image magewiki-${{ matrix.image }}-ci --config "$(dirname ${{ matrix.dockerfile }})/container-structure-test.yaml"
      # SBOM only, no cosign image signing: nothing in this project ever pushes
      # these images to a registry (no GHCR/Docker Hub publish step exists at
      # all -- every job that uses these images, including this one, only
      # loads and discards them locally). Signing an image that's never
      # distributed verifies nothing for anyone -- there's no pull site for
      # a consumer to check the signature against. A CycloneDX SBOM has real
      # value even for a locally-built, never-published image: it's a
      # per-build, auditable record of exactly what's inside each image (OS
      # packages + language deps), independent of Trivy's own point-in-time
      # CVE scan above.
      - name: Generate SBOM (${{ matrix.image }})
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: magewiki-${{ matrix.image }}-ci
          format: cyclonedx-json
          output-file: sbom-${{ matrix.image }}.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.cdx.json

  e2e-smoke:
    needs: docker-build
    runs-on: ubuntu-latest
    # Backstop against GitHub's 6-hour default job ceiling if docker compose
    # or a Playwright run ever wedges instead of just failing outright.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # npm install (and the playwright browser install) must run BEFORE `docker
      # compose up` — docker-compose.yml's web service mounts ./frontend:/app with
      # node_modules/.next as separate container-only volumes, and bringing that
      # container up first makes Docker create host-side frontend/node_modules
      # owned by root, which the later npm install then can't write into
      # (EACCES) — confirmed directly from a real failed CI run, not a guess.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm install
      # Cache the downloaded Chromium binary across runs, keyed on the
      # installed @playwright/test version -- e2e-smoke is the longest
      # single job on the critical path (everything downstream of
      # docker-build waits on it), and re-downloading the same browser
      # binary from scratch every run was a real chunk of that. On a cache
      # hit the browser binary itself is already in place, but --with-deps'
      # apt-installed system libraries (fonts, libnss3, ...) aren't part of
      # that cache dir, so those still need installing every run --
      # install-deps alone is fast (no large download).
      - name: Get installed Playwright version
        id: playwright-version
        working-directory: frontend
        run: echo "version=$(node -e "console.log(require('@playwright/test/package.json').version)")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      - working-directory: frontend
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - working-directory: frontend
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - run: cp .env.example .env
      # A real scan root, not left empty like .env.example's default --
      # without this, is_within_scan_roots() fails closed and e2e tests
      # can never trigger a real scan through the UI, leaving every other
      # page's e2e coverage stuck testing only empty-state rendering.
      # The demo-store fixture is parser-only (no AI needed), so this scan
      # succeeds with no LLM/embedding key configured either.
      - run: echo "MAGEWIKI_SCAN_ROOT_1=$(pwd)/backend/tests/fixtures/demo-store" >> .env
      # Second scan root: two synthetic modules that deliberately conflict with
      # *each other* (cross-module conflict checks are scoped per repo_root, so
      # this can't exercise those checks against demo-store's own module) --
      # gives the e2e suite real coverage of acl_resource_conflict/missing_acl
      # and the whole fleet-wide conflict family, none of which demo-store's
      # single module can ever trigger. See frontend/tests/e2e/global-setup.ts.
      - run: echo "MAGEWIKI_SCAN_ROOT_2=$(pwd)/backend/tests/fixtures/conflict-store" >> .env
      # Load the 3 images docker-build already built once (this job's own
      # `needs:`) and tag them to match docker-compose.yml's own
      # auto-generated service image names (<project>-<service>, project
      # name "magewiki" from this repo's directory name) -- api/worker/
      # migrate share one backend build, same dedup `docker compose build`
      # itself would do. `docker compose up -d` below with no --build then
      # reuses these already-tagged local images instead of rebuilding.
      # docker-build is now a matrix (one artifact per image, name
      # docker-image-<image>) -- merge-multiple: true pulls all 3 straight
      # into one directory with no per-artifact subfolders, since each
      # artifact already holds one uniquely-named tar.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: docker-image-*
          path: /tmp
          merge-multiple: true
      - run: |
          docker load -i /tmp/magewiki-backend-ci.tar
          docker load -i /tmp/magewiki-frontend-ci.tar
          docker load -i /tmp/magewiki-php-analyzer-ci.tar
          docker tag magewiki-backend-ci magewiki-api
          docker tag magewiki-backend-ci magewiki-worker
          docker tag magewiki-backend-ci magewiki-migrate
          docker tag magewiki-frontend-ci magewiki-web
          docker tag magewiki-php-analyzer-ci magewiki-php-analyzer
      # frontend/next-env.d.ts isn't tracked by git (Next.js generates it on
      # first `next dev`/`next build`) and isn't one of the anonymous
      # node_modules/.next volumes Docker already seeds node-owned -- it's a
      # brand new file `next dev` creates inside the bind-mounted ./frontend
      # the first time it runs in CI. Creating a file needs write permission
      # on the *directory*, not the (nonexistent) file -- confirmed directly
      # with `chmod 666` on the file itself: "No such file or directory".
      # ./frontend is owned by the runner's own user (from checkout), and the
      # container's non-root `node` is neither that owner nor in its group,
      # so it EACCESs trying to create the file, every run since
      # frontend/Dockerfile moved to `USER node` -- never surfaced before
      # because nothing required e2e-smoke to pass until now.
      - run: chmod o+w frontend
      - run: docker compose up -d
      - name: Wait for api and web to be ready
        run: |
          timeout 120 bash -c 'until curl -sf http://localhost:8000/scan-roots > /dev/null; do sleep 2; done'
          timeout 120 bash -c 'until curl -sf http://localhost:3000/modules > /dev/null; do sleep 2; done'
      # Closes a known gap (see the decision log's "Stale generated OpenAPI
      # types" entry): frontend/lib/api-types.ts is hand-regenerated via
      # `npm run gen:types` against a live backend, and nothing previously
      # caught it going stale -- which once left a Settings flow silently
      # broken end-to-end for several sessions. The api container is
      # already live here on the same host:port gen:types targets, so no
      # new service is needed.
      - name: Check generated API types are up to date
        working-directory: frontend
        run: |
          npm run gen:types
          git diff --exit-code lib/api-types.ts
      - working-directory: frontend
        run: npx playwright test
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:3000
      - if: always()
        run: docker compose logs --tail=200

  k8s-smoke:
    # Phase 8's own "done when" bar is "full stack runs on a local cluster" --
    # until now that was only ever checked by hand (README's own kind recipe).
    # This job runs that exact recipe for real whenever something it actually
    # exercises changes (see the `changes` job above -- k8s/, the 3
    # Dockerfiles, or docker-compose.yml), so a broken Kustomize manifest (bad
    # YAML, a configmap key renamed in api.yaml but not configmap.yaml, a
    # Service/Deployment selector mismatch, etc.) fails CI instead of shipping
    # silently. Skipped (not removed) on a push/PR that can't have touched any
    # of that -- the single slowest job in this workflow, not worth paying on
    # every unrelated change.
    needs: [docker-build, changes]
    if: needs.changes.outputs.k8s == 'true'
    runs-on: ubuntu-latest
    # Backstop against GitHub's 6-hour default job ceiling if the kind
    # cluster or a kubectl wait ever wedges instead of just failing outright.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Load the same three images docker-build already built once (this
      # job's own `needs:`) and tag them :dev to match what k8s/base's
      # manifests reference -- see
      # k8s/base/{api,worker,web,php-analyzer,migrate-job}.yaml.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: docker-image-*
          path: /tmp
          merge-multiple: true
      - run: |
          docker load -i /tmp/magewiki-backend-ci.tar
          docker load -i /tmp/magewiki-frontend-ci.tar
          docker load -i /tmp/magewiki-php-analyzer-ci.tar
          docker tag magewiki-backend-ci magewiki-backend:dev
          docker tag magewiki-frontend-ci magewiki-frontend:dev
          docker tag magewiki-php-analyzer-ci magewiki-php-analyzer:dev
      - uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          cluster_name: magewiki
          config: k8s/overlays/kind/kind-config.yaml
          wait: 90s
      - run: |
          kind load docker-image magewiki-backend:dev magewiki-frontend:dev magewiki-php-analyzer:dev --name magewiki
      # CI has no real LLM/HMAC secrets to put here and doesn't need any --
      # this job only proves the manifests apply and the stack comes up, the
      # same bar README's own manual recipe checks.
      - run: cp k8s/base/.env.k8s.example k8s/base/.env.k8s
      - run: kubectl apply -k k8s/overlays/kind
      - run: kubectl wait --for=condition=complete job/migrate -n magewiki --timeout=120s
      - run: kubectl rollout restart deployment/api deployment/worker -n magewiki
      - run: kubectl wait --for=condition=available deployment/api deployment/worker deployment/web deployment/php-analyzer -n magewiki --timeout=120s
      - name: curl api and web through the kind NodePort mapping
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:8080/health > /dev/null; do sleep 2; done'
          timeout 60 bash -c 'until curl -sf http://localhost:3080/modules > /dev/null; do sleep 2; done'
      - if: failure()
        run: |
          kubectl get pods -n magewiki -o wide
          kubectl describe pods -n magewiki
          kubectl logs -n magewiki -l app --all-containers --tail=200 || true

  rag-eval-comment:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: magewiki
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: magewiki
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U magewiki"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/setup-backend-env
      - run: poetry run python -m app.evaluation.run_ci_eval
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3
        with:
          path: backend/app/evaluation/report/ci_eval_comment.md
