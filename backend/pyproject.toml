[tool.poetry]
name = "magewiki"
version = "0.1.0"
description = "MageWiki-AI backend — API, scanner, and RAG for Magento 2 codebases"
license = "MIT"
authors = ["Michał Per"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115"
uvicorn = { extras = ["standard"], version = "^0.32" }
pydantic = "^2.9"
pydantic-settings = "^2.6"
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.30"
alembic = "^1.13"
tree-sitter = "^0.25"
tree-sitter-php = "^0.24"
lxml = "^5.3"
arq = "^0.28"
redis = "^5.2"

# --- Future phases (not installed yet, documented here per architecture scaffold) ---
# Phase 3 (analyzer/):       litellm
# Phase 4 (vectorstore/rag): pgvector (python client), rank-bm25 is NOT used — hybrid search is done in Postgres (tsvector/pg_trgm)
# Testing (RAG eval):        ragas

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^1.0"
httpx = "^0.27"
ruff = "^0.7"
mypy = "^1.13"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-m 'not slow'"
markers = ["slow: real-fixture tests against large external checkouts"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
