[tool.poetry]
name = "magewiki"
version = "0.1.0"
description = "MageWiki-AI backend — API, scanner, and RAG for Magento 2 codebases"
license = "MIT"
authors = ["Michał Per"]
packages = [{ include = "app" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.15"
fastapi = ">=0.115,<0.163"
uvicorn = { extras = ["standard"], version = ">=0.32,<0.55" }
pydantic = "^2.9"
pydantic-settings = "^2.6"
sqlalchemy = { extras = ["asyncio"], version = "^2.0" }
asyncpg = "^0.30"
alembic = "^1.13"
tree-sitter = ">=0.25,<0.27"
tree-sitter-php = "^0.24"
lxml = "^6.1"
arq = "^0.28"
redis = "^5.2"
litellm = "^1.108"
mcp = "^1.1"  # litellm's tool-calling path imports this internally; not declared as its own dependency.
# litellm.acompletion/completion eagerly imports litellm.responses.mcp.* whenever `tools` is passed,
# even for plain function-calling with no MCP tools involved — pass `_skip_mcp_handler=True` on every
# acompletion()/completion() call that uses `tools=` to avoid that path (and its brittle mcp-package-
# version coupling) entirely. Verified empirically: with _skip_mcp_handler=True, tool-calling works
# regardless of the installed mcp version.
pgvector = "^0.5"
httpx = "^0.28"

# --- Future phases (not installed yet, documented here per architecture scaffold) ---
# Testing (RAG eval):        ragas

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
pytest-asyncio = "^1.0"
pytest-cov = ">=6,<8"
ruff = "^0.17"
mypy = ">=1.13,<3.0"
lxml-stubs = "^0.5"
pip-audit = "^2.7"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection pattern (`session: AsyncSession = Depends(get_session)`)
# is a function call in an argument default by design — not the mutable-default-argument
# bug B008 exists to catch. This is FastAPI's own documented ruff config recommendation.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
addopts = "-m 'not slow and not llm and not embeddings and not ollama'"
markers = [
    "slow: real-fixture tests against large external checkouts",
    "llm: tests that make real Anthropic API calls and spend real budget — run explicitly with `pytest -m llm`",
    "embeddings: tests that make real OpenAI embedding calls and spend real budget — run explicitly with `pytest -m embeddings`",
    "ollama: tests that call a real local Ollama server — free, but require OLLAMA_BASE_URL reachable; run explicitly with `pytest -m ollama`",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
